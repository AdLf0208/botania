[package]
# Port of Botania 1.20.1-456 (VazkiiMods/Botania, tag release-1.20.1-456, the
# Botania License). Minecraft Java 1.20.1 Forge; the port targets Horizon 26.3 at
# the pin in horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour
# (FINDINGS.md). Copyleft-style licence (rank 1): the port ships the Botania
# License as its own LICENSE and stays open source (LICENSE-NOTICE.md).
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "botania"
version = "0.2.0"
edition = "2024"
license = "LicenseRef-Botania-License"
description = "Botania for Horizon: an endoflame, a mana spreader and a mana pool"
publish = false

[lib]
# The pure mana arithmetic is `src/runtime.rs`; the crate root is `src/lib.rs`.
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build). This port
# adds no registry dependency of its own.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
